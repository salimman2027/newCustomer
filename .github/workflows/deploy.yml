name: Deploy to MonsterASP (nqcustomers.runasp.net)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - name: Check required secrets
        shell: pwsh
        env:
          WD_PASS: ${{ secrets.WEBDEPLOY_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          $missing = @()
          if (-not $env:WD_PASS) { $missing += 'WEBDEPLOY_PASSWORD' }
          if (-not $env:DB_CONNECTION) { $missing += 'DB_CONNECTION' }
          if ($missing.Count) { throw "Missing GitHub secrets: $($missing -join ', ')  (Settings > Secrets and variables > Actions)" }

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build server bundle
        run: |
          npm ci
          npm run build

      - name: Write secrets.json from GitHub Secrets
        shell: pwsh
        env:
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          CENTRAL_KEY: ${{ secrets.CENTRAL_KEY }}
        run: |
          $secret = $env:SESSION_SECRET
          if (-not $secret) { $sha = [System.Security.Cryptography.SHA256]::Create(); $secret = [Convert]::ToHexString($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes("nq-session:" + $env:DB_CONNECTION))) }
          $admins = @($env:ADMIN_EMAILS -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          @{ DB_CONNECTION = $env:DB_CONNECTION; SESSION_SECRET = $secret; ADMIN_EMAILS = $admins; CENTRAL_KEY = $env:CENTRAL_KEY } |
            ConvertTo-Json | Set-Content -Encoding utf8 deploy\secrets.json

      - name: Install Web Deploy if missing
        shell: pwsh
        run: |
          $md = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          if (-not (Test-Path $md)) { choco install webdeploy -y --no-progress }

      - name: Deploy with Web Deploy
        shell: pwsh
        env:
          WD_SITE: site109140
          WD_HOST: site109140.siteasp.net
          WD_USER: site109140
          WD_PASS: ${{ secrets.WEBDEPLOY_PASSWORD }}
        run: |
          $md = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          $src = "$env:GITHUB_WORKSPACE\deploy"
          & $md -verb:sync `
            "-source:contentPath=$src" `
            "-dest:contentPath=$env:WD_SITE,computerName=https://$($env:WD_HOST):8172/msdeploy.axd?site=$($env:WD_SITE),userName=$env:WD_USER,password=$env:WD_PASS,authType=Basic" `
            -allowUntrusted -enableRule:AppOffline `
            "-skip:objectName=dirPath,absolutePath=logs$"
          if ($LASTEXITCODE -ne 0) { throw "msdeploy failed with code $LASTEXITCODE" }

      - name: Health check
        shell: pwsh
        run: |
          Start-Sleep -Seconds 15
          try { (Invoke-WebRequest -UseBasicParsing "http://nqcustomers.runasp.net/api/health").Content; try { "home over http -> " + (Invoke-WebRequest -UseBasicParsing -MaximumRedirection 0 -ErrorAction SilentlyContinue "http://nqcustomers.runasp.net/").StatusCode } catch { "home over http -> " + $_.Exception.Response.StatusCode.value__ } } catch { $_.Exception.Response.StatusCode; $_.ErrorDetails.Message }
